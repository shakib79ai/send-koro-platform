<title>Send Koro Driver App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800;1,900&family=Merriweather:wght@700;900&family=Nunito+Sans:opsz,wght@6..12,600;6..12,700;6..12,800;6..12,900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--g:#0D3B2E;--g2:#1F5A47;--gt:#E4F0E8;--gx:#0D5C3F;--o:#F2600C;--o2:#C2410C;--ot:#FFF1E6;--bg:#FBF6EE;--card:#FFFFFF;--line:#ECE3D6;--line2:#D9CFC0;--ink:#17201B;--mut:#5E6560;--red:#B42318;--redt:#FFF1EE;--warn:#FFF4E5;--warnx:#8A3B00;--stage:#E9E3D8;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gx)}
h1,h2,h3{margin:0;text-wrap:balance}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border:0;border-radius:12px;background:var(--o);color:#fff;font-weight:700;font-size:19px;text-decoration:none;white-space:nowrap}
.btn:disabled{background:#E2D8CA;color:var(--mut);cursor:not-allowed}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;background:var(--o2)}
.btn.dk{background:var(--g);font-size:16px}
.btn.ln{background:#fff;color:var(--g);border:1.5px solid var(--g);font-size:15px}
.btn.ln.sm{min-height:40px}
.btn.gh{background:transparent;color:var(--gx);font-size:15px;min-height:44px;padding:0 8px}
.btn.block{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pad{padding:16px}
.mut{color:var(--mut)}
.sm-t{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.in{height:48px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;width:100%;font-size:15px}
textarea.in{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.in:focus,.btn:focus-visible,.chip:focus-visible,.opt:focus-within,button:focus-visible,a:focus-visible{outline:3px solid #F9B98C;outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;border-radius:12px;border:1.5px solid #E2D8CA;background:#fff;font-weight:600;cursor:pointer;text-align:left}
.opt.on{border-color:var(--o);background:#FFF4EC}
.opt input{width:18px;height:18px;accent-color:var(--o);margin:0;flex:none}
.rw{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.rw.tot{font-size:19px;font-weight:800;padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.rw.save{color:var(--gx);font-weight:700}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.p-g{background:var(--gt);color:var(--gx)}.p-o{background:var(--ot);color:var(--warnx)}.p-n{background:#F3EDE3;color:var(--mut)}.p-r{background:var(--redt);color:var(--red)}
.note{padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45}
.n-g{background:var(--gt);color:var(--g)}.n-w{background:var(--warn);color:#4A2200}.n-r{background:var(--redt);color:#7A1A0E}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;background:#fff}
.qty button{width:38px;height:38px;border:0;background:transparent;font-size:18px}
.qty b{min-width:22px;text-align:center}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:200;max-width:min(420px,90vw);box-shadow:0 10px 30px rgba(0,0,0,.25);text-align:center}
.overlay{position:fixed;inset:0;background:rgba(15,20,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.device .overlay{position:absolute}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px;display:flex;flex-direction:column;gap:14px}
.web .overlay{align-items:center;padding:16px}
.web .sheet{border-radius:20px;max-height:88vh}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:#CFC6B8;margin:0;cursor:pointer;transition:background .15s}
.switch input:checked{background:#0D7A50}
.switch input::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:99px;background:#fff;transition:left .15s}
.switch input:checked::after{left:21px}
.demo{background:var(--g);color:#CFE3D7;font-size:12px;text-align:center;padding:6px 12px}
.demo b{color:#fff}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em}
.empty{padding:28px 16px;text-align:center;color:var(--mut)}
img{max-width:100%}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 16px}
.device{width:390px;max-width:100%;height:844px;max-height:calc(100vh - 80px);min-height:620px;border-radius:44px;border:10px solid #17201B;background:var(--bg);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.stage-note{font-size:13px;color:var(--mut);text-align:center;max-width:390px}
@media (max-width:440px){.stage{padding:0;gap:0}.device{border:0;border-radius:0;height:100vh;max-height:none;width:100%;min-height:0}.stage-note{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:760px){.rw-shell{flex-direction:column}.rw-shell>aside{width:100%!important;height:auto!important;position:static!important;flex-direction:row!important;flex-wrap:wrap;align-items:center;padding:10px max(12px,env(safe-area-inset-left,0px))!important}.rw-shell>aside>span:nth-child(2),.rw-shell>aside>.grow,.rw-shell>aside>div{display:none}.rw-shell>aside>.logo{padding:0 8px 0 0!important;flex-basis:100%}.rw-shell>aside>button{height:38px!important;padding:0 10px!important;box-shadow:none!important}.rw-shell main{padding-left:max(16px,env(safe-area-inset-left,0px))!important}}
.pages{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#fff;border-bottom:1px solid var(--line)}
.stage>.pages{max-width:880px;width:100%;border:1px solid var(--line);border-radius:16px}
.pages-l{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--o2);margin-right:4px}
.pages button{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:700;font-size:13px;color:var(--ink)}
.pages button:hover{border-color:var(--g)}
.pages button.on{background:var(--g);border-color:var(--g);color:#fff}
@media (max-width:440px){.stage>.pages{border-radius:0;border-width:0 0 1px;flex-wrap:nowrap;overflow-x:auto}}
.pages{position:relative;z-index:150}
.fwrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fcol{gap:9px}.fcol>b{color:#fff;font-size:15px;margin-bottom:2px}
.flink{border:0;background:none;color:#E4F0E8;padding:2px 0;text-align:left;font-size:14px;cursor:pointer}
.flink:hover{color:#fff;text-decoration:underline}
.info p{margin:0;line-height:1.55}
@media (max-width:760px){.rw-shell>aside>span:not(.logo){display:none}.rw-shell>aside{overflow:visible!important}}

.pages-l{white-space:nowrap}

/* ---- v3.1 home polish ---- */
.lx-top{background:radial-gradient(120% 90% at 100% 0%,#1F6B50 0%,var(--g) 55%,#082A20 100%);color:#fff;padding:16px 16px 18px;gap:14px;border-radius:0 0 26px 26px}
.lx-av{width:38px;height:38px;border-radius:99px;background:#FF7A2E;color:var(--g);display:flex;align-items:center;justify-content:center;font-weight:800}
.lx-addr{border:0;background:rgba(255,255,255,.1);color:#fff;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;text-align:left;font-size:14px;width:100%}
.lx-addr b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lx-hello{font-size:28px;line-height:1.08;letter-spacing:-.03em;margin:4px 0 0;text-wrap:balance}
.lx-search{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:999px;background:#fff;color:var(--mut);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.lx-search input{border:0;outline:0;flex:1;min-width:0;background:transparent;font-size:16px;color:var(--ink)}
.lx-seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:rgba(255,255,255,.12);max-width:340px;width:100%}
.lx-seg button{height:40px;border:0;border-radius:999px;background:transparent;color:#E4F0E8;font-weight:800;font-size:15px}
.lx-seg button.on{background:#FF7A2E;color:#1B1006;box-shadow:0 4px 14px rgba(242,96,12,.45)}
.lx-promos{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
.lx-promos::-webkit-scrollbar{display:none}
.lx-promo{position:relative;flex:0 0 min(300px,82%);height:168px;border:0;border-radius:20px;overflow:hidden;scroll-snap-align:start;padding:0;text-align:left;color:#fff;background:var(--tone)}
.lx-promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.lx-promo:hover img{transform:scale(1.05)}
.lx-promo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--tone) 18%,color-mix(in srgb,var(--tone) 55%,transparent) 55%,transparent)}
.lx-promo-t{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;padding:16px;max-width:72%;height:100%}
.lx-promo-t b{font-size:19px;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.lx-promo-t>span:not(.lx-kick):not(.lx-cta){font-size:13px;color:rgba(255,255,255,.82)}
.lx-cta{margin-top:auto;font-weight:800;font-size:14px;color:#FFB27F}
.lx-kick{display:inline-flex;align-self:flex-start;align-items:center;height:24px;padding:0 10px;border-radius:99px;background:#FF7A2E;color:#1B1006;font-size:12px;font-weight:800;letter-spacing:.02em}
.lx-cuis{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.lx-cuis::-webkit-scrollbar{display:none}
.lx-cu{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;font-weight:700;font-size:13px;color:var(--ink);padding:0;width:74px}
.lx-cu img{width:70px;height:70px;border-radius:99px;object-fit:cover;box-shadow:0 0 0 3px #fff,0 6px 16px rgba(28,22,16,.18);transition:transform .2s}
.lx-cu:hover img{transform:translateY(-3px)}
.lx-cu.on img{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--o)}
.lx-cu.on{color:var(--o2)}
.lx-h{font-size:22px;letter-spacing:-.02em;margin:0}
.lx-card{display:flex;flex-direction:column;border:0;padding:0;text-align:left;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 12px 28px -14px rgba(28,22,16,.28);transition:transform .2s,box-shadow .2s}
.lx-card:hover{transform:translateY(-3px);box-shadow:0 1px 0 var(--line),0 20px 36px -16px rgba(28,22,16,.38)}
.lx-img{position:relative;display:block;height:170px;overflow:hidden}
.lx-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.lx-card:hover .lx-img img{transform:scale(1.05)}
.lx-img::after{content:"";position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.35))}
.lx-deal{position:absolute;top:12px;left:12px;z-index:1;height:28px;padding:0 11px;display:flex;align-items:center;border-radius:99px;background:#FF7A2E;color:#1B1006;font-weight:800;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.lx-eta{position:absolute;bottom:10px;right:12px;z-index:1;height:28px;padding:0 10px;display:flex;align-items:center;border-radius:99px;background:rgba(255,255,255,.95);color:var(--g);font-weight:800;font-size:13px}
.lx-rate{flex:none;height:26px;padding:0 9px;border-radius:99px;background:var(--gt);color:var(--g);font-weight:800;font-size:13px;display:flex;align-items:center}
.lx-promise{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px;border-radius:18px;background:var(--g);color:#CFE3D7;font-size:12px;text-align:center}
.lx-promise span{display:flex;flex-direction:column;gap:2px}.lx-promise b{color:#FF9A5C;font-size:20px}
.lx-hero{position:relative;display:flex;flex-wrap:wrap;gap:32px;align-items:center;padding:44px clamp(20px,4vw,52px);border-radius:32px;overflow:hidden;color:#fff;background:radial-gradient(90% 120% at 100% 0%,#1F6B50 0%,var(--g) 50%,#072219 100%)}
.lx-hero::before{content:"";position:absolute;width:520px;height:520px;right:-120px;bottom:-260px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,46,.35),transparent 65%)}
.lx-hero-h{font-size:clamp(40px,5.2vw,66px);line-height:1;letter-spacing:-.04em;margin:0;color:#fff}
.lx-hero-h span{color:#FF8A47}
.lx-hero .lx-addr{background:rgba(255,255,255,.08);width:auto}
.lx-collage{position:relative;flex:1 1 380px;min-height:360px;max-width:560px}
.lx-collage img{position:absolute;object-fit:cover;border-radius:24px;box-shadow:0 24px 50px rgba(0,0,0,.35);border:4px solid rgba(255,255,255,.9)}
.lx-collage .c1{width:68%;height:72%;left:0;top:6%;transform:rotate(-3deg)}
.lx-collage .c2{width:46%;height:48%;right:0;top:0;transform:rotate(4deg)}
.lx-collage .c3{width:44%;height:44%;right:6%;bottom:0;transform:rotate(-2deg)}
.lx-float{position:absolute;z-index:2;display:flex;gap:6px;align-items:center;padding:9px 14px;border-radius:99px;background:#fff;color:var(--ink);font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);white-space:nowrap}
.lx-float b{color:var(--o2);font-size:15px}
.lx-float.f1{left:4%;bottom:12%}.lx-float.f2{left:42%;top:46%}.lx-float.f3{right:2%;bottom:-2%}
@media (max-width:640px){.lx-collage{display:none}.lx-hero{padding:28px 20px;border-radius:24px}}
@media (prefers-reduced-motion:reduce){.lx-card,.lx-card img,.lx-promo img,.lx-cu img{transition:none}}

/* ---- v3.1 driver polish ---- */
.dx-hero{position:relative;height:330px;overflow:hidden;background:#0F2A22}
.dx-map{position:absolute;inset:0;width:100%;height:100%}
.dx-topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:2}
.dx-av{width:42px;height:42px;border-radius:99px;border:2px solid rgba(255,255,255,.7);background:#FF7A2E;color:#1B1006;font-weight:800;font-size:17px}
.dx-earn{margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:6px 18px;border:0;border-radius:99px;background:#fff;color:var(--g);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.dx-earn span{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}.dx-earn b{font-size:20px;letter-spacing:-.02em}
.dx-status{height:30px;padding:0 12px;border-radius:99px;display:flex;align-items:center;font-size:13px;font-weight:800;background:rgba(255,255,255,.14);color:#fff}
.dx-status.on{background:#7CF0B4;color:#073424}
.dx-go{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,0);z-index:3;width:116px;height:116px;border-radius:99px;border:6px solid var(--bg);background:radial-gradient(circle at 35% 30%,#3FCB8A,#0D7A50 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(13,122,80,.55)}
.dx-go b{font-size:30px;letter-spacing:.04em;line-height:1}.dx-go span{font-size:11px;font-weight:700;opacity:.85}
.dx-go.on{background:radial-gradient(circle at 35% 30%,#5A4A42,#2A211D 70%);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.dx-go:not(.on)::after{content:"";position:absolute;inset:-6px;border-radius:99px;border:3px solid #3FCB8A;animation:dxpulse 2s infinite}
@keyframes dxpulse{from{transform:scale(1);opacity:.8}to{transform:scale(1.35);opacity:0}}
.dx-sheet{position:relative;margin-top:-18px;padding:72px 14px 22px;gap:14px;background:var(--bg);border-radius:26px 26px 0 0}
.dx-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dx-stats div{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:16px;background:var(--card);box-shadow:0 1px 0 var(--line),0 8px 20px -14px rgba(28,22,16,.35)}
.dx-stats span{font-size:11px;color:var(--mut);font-weight:700}.dx-stats b{font-size:20px;color:var(--g);letter-spacing:-.02em}
.dx-week{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;padding:16px;border:0;border-radius:20px;text-align:left;color:#fff;background:radial-gradient(120% 120% at 100% 0%,#1F6B50,var(--g) 55%,#072219)}
.dx-chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;width:100%;height:110px;margin-top:10px;align-items:end}
.dx-bar{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.dx-bar i{display:block;width:100%;max-width:28px;border-radius:8px 8px 4px 4px;background:var(--gt)}
.dx-bar.dk i{background:rgba(255,255,255,.22)}.dx-bar.now i{background:linear-gradient(#FFB27F,#F2600C)}
.dx-bar em{font-style:normal;font-size:10px;font-weight:700;color:var(--mut)}.dx-bar.dk em{color:#CFE3D7}
.dx-bar b{font-size:11px;color:var(--mut)}.dx-bar.dk b{color:#A9C9B8}
.dx-perks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dx-perks span{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;padding:10px 4px;border-radius:14px;background:var(--ot);font-size:11px;color:var(--warnx);font-weight:600}
.dx-perks b{font-size:14px;color:var(--o2)}
.dx-offer{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:20px;color:#fff;background:radial-gradient(120% 120% at 100% 0%,#1F6B50,var(--g) 55%,#072219)}
.dx-offer>b{font-size:46px;line-height:1.02;letter-spacing:-.03em}
.dx-chip{height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:99px;background:rgba(255,255,255,.12);font-weight:800;font-size:13px}
.dx-welcome{background:radial-gradient(110% 70% at 80% 10%,#1F6B50,var(--g) 50%,#061D16)}
@media (prefers-reduced-motion:reduce){.dx-go::after{animation:none}}
@media (min-width:900px){.web .lx-cu{width:104px}.web .lx-cu img{width:96px;height:96px}.web .lx-cu{font-size:14px}}

/* ---- v3.2 customer polish (scoped to .cx) ---- */
.cx .card{border-radius:18px;border-color:#EFE6D8;box-shadow:0 1px 0 rgba(28,22,16,.04),0 10px 26px -18px rgba(28,22,16,.35)}
.cx .btn:not(.ln):not(.gh):not(.dk):not(:disabled){background:linear-gradient(180deg,#FF7A2E,#EE5A08);box-shadow:0 8px 20px -8px rgba(242,96,12,.6),inset 0 1px 0 rgba(255,255,255,.25);border-radius:14px;transition:transform .15s,box-shadow .15s}
.cx .btn:not(.ln):not(.gh):not(.dk):not(:disabled):hover{transform:translateY(-1px);box-shadow:0 12px 24px -8px rgba(242,96,12,.7),inset 0 1px 0 rgba(255,255,255,.25)}
.cx .btn.ln{border-radius:14px;border-color:#CFE0D5}
.cx .btn.dk{border-radius:14px;background:linear-gradient(180deg,#1F5A47,var(--g))}

    terms: { title: 'Terms of Service', short: 'Customer terms for ordering on Send Koro', who: ['customer'], sections: [
      ['Who we are', p(`Send Koro is an online marketplace that connects you with local restaurants and arranges delivery. Send Koro is operated by ${ENTITY}, ${ADDRESS} (“Send Koro”, “we”, “us”). These Terms of Service (“Terms”) apply when you use the Send Koro website, progressive web app and mobile apps (the “Services”) to browse, order, pick up or receive food.`, `By creating an account or placing an order you agree to these Terms, the ${link('privacy', 'Privacy Policy')}, the ${link('refunds', 'Refund and Cancellation Policy')} and the ${link('usage', 'Community Guidelines and Acceptable Use Policy')}. If you don’t agree, please don’t use the Services.`)],
      ['How the marketplace works', ul(['<b>Restaurants sell the food.</b> Each restaurant prepares your food, sets its own menu prices, service charges and sales tax, and is the seller of the food. Send Koro is not a restaurant and does not prepare food.', '<b>Send Koro runs the marketplace and arranges delivery.</b> Deliveries are made by independent couriers, who may be couriers using the Send Koro driver app or couriers provided by third-party delivery partners.', '<b>Payments.</b> Your card is processed by our payment provider, Stripe, on behalf of the restaurant. The food, tax and any restaurant charges go to the restaurant; the delivery fee and tip are used to pay for delivery.'])],

      ['Prices, fees and taxes', ul(['<b>Food prices</b> are set by each restaurant. Prices on Send Koro may differ from prices in the restaurant.', '<b>Delivery fee.</b> Send Koro charges a delivery fee that covers the courier and the cost of delivery. The restaurant may pay part or all of it; you see what you pay before you order. Send Koro does not charge a service fee, small-order fee or surge fee.', '<b>Restaurant charges.</b> A restaurant may add its own service charge or packaging fee. Any such charge is shown before you pay.', '<b>Sales tax</b> is set and charged by the restaurant at its location’s rate.', '<b>Tips</b> are optional. 100% of your tip goes to the courier who delivers your order.', 'All amounts are in US dollars.'])],
      ['Placing and paying for an order', ol(['When you place an order, your card is <b>authorized</b> (a temporary hold) for the order total.', 'The restaurant has up to 5 minutes to accept. <b>You are charged only when the restaurant accepts.</b>', 'If the restaurant declines or doesn’t answer in time, the hold is released and you are not charged.', 'Once accepted, the order is a purchase from the restaurant. Cancellations and refunds follow the Refund and Cancellation Policy.']), p('We may refuse or cancel an order if we suspect fraud, if an item is unavailable, or if a price or description was clearly wrong. If we cancel, you are not charged, or you are refunded.')],
      ['Delivery and pickup', ul(['Delivery times are estimates. Weather, traffic and restaurant volume can cause delays.', 'Be available at the delivery address. Couriers complete delivery by leaving the order at your door with a photo, or by handing it to you after you give a 4-digit PIN, depending on what you choose.', 'If the courier can’t reach you or can’t access the address, the order may be left in a safe place or returned, and may not be refunded.', 'For pickup orders, collect your order from the restaurant and show your order number.', 'Send Koro does not deliver alcohol, tobacco, cannabis or other age-restricted items at this time.'])],
      ['Food safety, allergens and dietary information', p('Restaurants provide menu descriptions, dietary labels and allergen information. Send Koro does not verify this information and cannot guarantee that food is free of any allergen. If you have a food allergy or a dietary need, contact the restaurant before ordering and add a note to your order.')],
      ['Send Koro credit, promotions and referrals', ul(['Send Koro credit comes from promo codes and the “Refer a friend” program. Credit is a promotional benefit, has no cash value, can’t be transferred or sold, and is not a gift card.', 'Credit is available only to customers with a verified US mobile number and expires 30 days after it is issued, unless stated otherwise.', 'Credit can be used only at checkout, toward food and tax. At least $0.50 of each order must be paid by card.', 'Referral rewards: the new customer receives their reward on sign-up with a valid code; the referrer receives theirs after the new customer’s first completed order. One reward per person, phone number and payment card. Monthly limits may apply.', 'Restaurant promotions (such as buy one get one, or a percentage off) are offered and paid for by the restaurant and may have their own conditions.', 'We may change or end promotions at any time, and may cancel credit obtained through fraud, abuse or breach of these Terms.'])],
      ['Ratings, reviews and content', p('If you leave a rating, review, photo or other content, it must be honest and follow the Community Guidelines. You give Send Koro a worldwide, royalty-free license to use, display and remove that content in connection with the Services. We may remove content that breaks our rules.')],
      ['Acceptable use', p(`You agree to follow the ${link('usage', 'Community Guidelines and Acceptable Use Policy')}. Don’t misuse the Services: no fraud, no fake accounts, no abuse of couriers, restaurant staff or support agents, no scraping, and no interfering with the Services.`)],
      ['Text messages', p(`We text you sign-in codes and order updates. See the ${link('sms', 'Text Message Terms')}. Message and data rates may apply. Reply STOP to stop non-essential texts.`)],
      ['Third-party services', p('The Services use third-party providers, including Stripe for payments, map and address providers, and delivery partners. Their terms and privacy policies also apply to their services. Send Koro is not responsible for third-party services beyond what the law requires.')],
      ['Intellectual property', p('Send Koro, its logo and the Services are owned by Send Koro or its licensors. Restaurant names, logos, menus and photos belong to the restaurants. You may use the Services only for your personal, non-commercial use.')],
      ['Disclaimers', p('The Services are provided “as is” and “as available”. To the fullest extent allowed by law, Send Koro disclaims warranties of merchantability, fitness for a particular purpose and non-infringement. The restaurant is responsible for the food it prepares and sells.')],
      ['Limitation of liability', p('To the fullest extent allowed by law, Send Koro is not liable for indirect, incidental, special, consequential or punitive damages, or for lost profits or data. Send Koro’s total liability for any claim relating to the Services is limited to the greater of the amount you paid for the order giving rise to the claim or $100. Nothing in these Terms limits liability that cannot be limited by law.')],

      ['Disputes and arbitration', p('<b>Please read this section carefully. It affects how disputes are resolved.</b>'), ol([
        '<b>Talk to us first.</b> Most problems are solved quickly through Help in the app. If not, send a written notice to info@sendkoro.com or by mail to the address below, with your name, phone number, a description of the problem and what you want. We will try in good faith to resolve it within 45 days, and you agree to do the same before starting a case.',

        '<b>Costs.</b> For claims under $10,000, Send Koro pays the AAA filing, administration and arbitrator fees, unless the arbitrator finds the claim frivolous.',

        '<b>No class actions.</b> Disputes are resolved only on an individual basis. You and Send Koro waive the right to bring or join a class action, collective action or representative proceeding, and to a jury trial. If this class-action waiver is found unenforceable for a claim, that claim goes to court and not to arbitration.',

        '<b>Governing law and courts.</b> These Terms are governed by the laws of the State of New York and the Federal Arbitration Act, without regard to conflict-of-law rules, except where your local law gives you rights that cannot be waived. Any case that goes to court will be brought in the state or federal courts located in Kings County or New York County, New York.',
        '<b>Time limit.</b> To the extent the law allows, a claim must be started within one year after it arises.'])],
      ['Ending your account', p('You can close your account at any time in Account → Privacy center → Delete my account. We may suspend or close accounts that break these Terms. Sections that by their nature should survive (such as payment obligations, disclaimers and limitations of liability) continue after your account ends.')],
      ['Changes to these Terms', p('We may update these Terms. If a change is material, we will tell you in the app or by email before it takes effect. Continuing to use the Services after the change means you accept it.')],
      ['Contact', p(`${ENTITY}<br>${ADDRESS}<br>Email: ${EMAIL}<br>Order help is fastest in the app under Help.`)],
    ] },
    refunds: { title: 'Refund and Cancellation Policy', short: 'Cancellations, refunds and who pays for what', who: ['customer', 'restaurant'], sections: [
      ['Summary', ul(['You are charged only when the restaurant accepts your order.', 'Cancel for free until the restaurant accepts.', 'Report a problem within 48 hours in Help, with a photo when you can.', 'Approved refunds go back to your original payment method in 5–10 business days. Send Koro credit you used is returned to your wallet.'])],
      ['Cancelling an order', tbl(['When you cancel', 'What happens'], [['Before the restaurant accepts', 'Free. The hold on your card is released and you pay nothing.'], ['After the restaurant accepts, before it’s ready', 'The restaurant has started cooking. A refund is at the restaurant’s and Send Koro’s discretion and may be partial.'], ['After the order is ready or picked up', 'Usually not refundable, unless there was a problem we can confirm (see below).'], ['Restaurant declines or doesn’t answer in 5 minutes', 'Automatic. You are never charged.']])],
      ['Problems we refund', tbl(['Problem', 'Usual outcome (after review)'], [['Missing item', 'Refund for the missing item and its tax.'], ['Wrong item', 'Refund for the wrong item; sometimes a full refund.'], ['Order never arrived', 'Full refund, including delivery fee and tip.'], ['Order arrived badly damaged or spilled', 'Refund for the affected items, or a full refund.'], ['Food safety concern', 'Full refund. Please also tell the restaurant and, if you are unwell, seek medical advice.'], ['Very late order', 'Case by case, often as Send Koro credit.']]), p('Report problems in the app: Orders → choose the order → Get help. Add photos of the items and the receipt label when you can. We may ask the restaurant and the courier for information before deciding.')],
      ['How refunds are paid', ul(['Refunds go to the payment method you used. Your bank may take 5–10 business days to show it.', 'If you used Send Koro credit, that part is returned to your wallet with a new 30-day expiry.', 'Tips are refunded when the order was not delivered. Otherwise tips stay with the courier.', 'Taxes are refunded together with the items they were charged on.'])],
      ['Limits and fair use', p('Refunds are for genuine problems. We may decline refunds, limit future refunds, or close accounts when we see repeated or false claims, or when a problem was caused by an incorrect address, an unreachable customer or a cancelled order after preparation.')],
      ['For restaurants: who pays for a refund', tbl(['Part of the order', 'Paid back by'], [['Food, sales tax and restaurant service or packaging charges', 'The restaurant, from its Stripe balance'], ['Customer’s delivery fee', 'Send Koro'], ['Restaurant’s delivery share', 'Restored to the restaurant when the delivery is refunded'], ['Courier tip (only if not delivered)', 'Send Koro'], ['Card processing fee on the original charge', 'Kept by Stripe. The delivery’s share of that fee is credited to the restaurant on its next plan invoice']]), p('Restaurants request refunds through “Report a problem” on the order. Send Koro reviews the request, contacts the customer and issues the refund so every part is returned correctly. Refunds are never made directly in Stripe. Refunds lower the restaurant’s net food sales in the month they are made. Card disputes (chargebacks) on food are handled by the restaurant in its Stripe account; Send Koro helps with order evidence.')],
      ['Contact', p('Order problems: Help in the app or <b>info@sendkoro.com</b>.')],
    ] },
    privacy: { title: 'Privacy Policy', short: 'What we collect, why, who sees it, and your choices', who: ['customer', 'restaurant', 'driver'], sections: [
      ['Who this covers', p(`This Privacy Policy explains how ${ENTITY} (“Send Koro”) collects, uses and shares personal information when you use our websites, apps and services as a <b>customer</b>, a <b>restaurant partner</b> (owners, managers and staff) or a <b>courier</b> using the Send Koro driver app. We do not sell your personal information.`)],
      ['Information we collect', tbl(['Who', 'What we collect'], [['Everyone', 'Name, mobile number, email; sign-in codes and login history; device, browser and app information; IP address; messages with support; your settings and choices.'], ['Customers', 'Delivery addresses and notes; approximate or precise location if you allow it (to suggest addresses and nearby restaurants); orders, ratings and reviews; Send Koro credit, referrals and promo codes; payment details are collected and stored by Stripe — we receive only the card brand, last 4 digits, expiry and a token.'], ['Restaurant partners', 'Business details (legal name, DBA, entity type, EIN), owner and team member details, locations, food permits and sales tax IDs, menus and photos, hours, order activity, plan and billing information. Bank and identity details are collected by Stripe for payouts.'], ['Couriers', 'Identity and contact details; vehicle type; precise location while you are online and on a trip; trip, pickup and delivery events; drop-off photos; ratings; earnings and tips; tax information collected by Stripe for 1099 forms. Bank and identity verification are handled by Stripe.']])],
      ['How we use information', ul(['To provide the marketplace: sign you in, show restaurants, take and route orders, arrange delivery, and show order status.', 'To process payments, payouts, plans, refunds and Send Koro credit, through Stripe.', 'To keep the Services safe: verify phone numbers, prevent fraud and promotion abuse, and enforce our rules.', 'To provide support and send service messages (order updates, receipts, sign-in codes).', 'To meet legal, tax and accounting obligations (for example 1099 forms for couriers and records restaurants need for sales tax).', 'To improve the Services using aggregated or de-identified data.', 'To send marketing only with your consent where required. You can opt out anytime.'])],
      ['Who we share information with', tbl(['Recipient', 'What they receive and why'], [['Restaurants', 'For each order: your first name and last initial, the items, notes, and for delivery orders the delivery area and courier status. Restaurants may use this only to fulfil your order.'], ['Couriers and delivery partners', 'Pickup details, your first name, delivery address and instructions, and a way to contact you through masked calling or messaging, only to complete the delivery.'], ['Customers', 'For couriers: your first name, vehicle type and live location during the delivery.'], ['Stripe', 'Payment, payout, identity and tax information needed to process payments and meet financial regulations.'], ['Service providers', 'Hosting, text messaging, email, maps and address lookup, customer support and analytics providers who work on our behalf under contract.'], ['Legal and safety', 'Law enforcement or others when required by law, or to protect the safety of any person or prevent fraud.'], ['Business transfers', 'A buyer or successor if Send Koro is involved in a merger, acquisition or sale of assets, with notice to you.']]), p('We do not sell personal information, and we do not share it for cross-context behavioral advertising.')],
      ['Location', p('Customers: we use location only if you allow it, to suggest your address and show nearby restaurants. Couriers: the driver app collects precise location while you are online and during trips, to send offers, navigate and show customers delivery progress. Location collection stops when you go offline. You can change location permissions in your device settings.')],
      ['Cookies and similar technologies', p('Our websites use cookies that are needed to sign you in and keep your cart, and optional analytics cookies that help us improve the site. Change your choice anytime in Cookie settings at the bottom of the website.')],
      ['How long we keep information', ul(['Account information: while your account is open, then deleted or de-identified within 90 days of closing, except as below.', 'Order, payment and tax records: as long as required by tax and financial law (generally 7 years).', 'Courier location history: up to 1 year, then deleted or de-identified.', 'Drop-off photos: 90 days, unless needed for a dispute.', 'Information needed for safety, fraud prevention or legal claims: as long as needed for that purpose.'])],
      ['Your choices and rights', ul(['See and update your profile, addresses and notification settings in the app.', '<b>Download your data</b> or <b>delete your account</b> in Account → Privacy center, or email info@sendkoro.com.', 'Turn off marketing emails and texts in notification settings, or reply STOP to texts.', 'Depending on where you live, you may have rights to access, correct, delete or port your information, and to appeal a decision about your request. We will not discriminate against you for using these rights. We verify requests with a code sent to your phone or email.'])],

      ['Children', p('The Services are not for children. You must be 18 or older to create an account. We do not knowingly collect information from children under 13; if we learn we have, we delete it.')],
      ['Changes', p('We will post updates here and tell you in the app or by email before material changes take effect.')],

    usage: { title: 'Community Guidelines and Acceptable Use Policy', short: 'How everyone on Send Koro treats each other, and what isn’t allowed', who: ['customer', 'restaurant', 'driver'], sections: [
      ['Our standards', p('Send Koro works because customers, restaurant teams and couriers respect each other. These guidelines apply to everyone using Send Koro and to every interaction: in the app, on the phone, at the restaurant and at the door.')],

      ['Customers', ul(['Give an accurate address and delivery instructions, and be reachable during delivery.', 'Report problems honestly. Repeated false refund claims are not allowed.', 'One account per person; don’t create accounts to get extra referral rewards or promo credit.', 'Tip as you choose; never ask couriers to break traffic laws or rules.'])],
      ['Restaurants', ul(['Keep your menu, prices, allergens and hours accurate, and prepare food safely in a licensed kitchen.', 'Keep permits and sales tax registration current.', 'Accept or decline orders promptly; don’t accept orders you can’t make.', 'Hand orders only to the courier with the matching order number. Treat couriers well, including access to a restroom where possible.', 'Use customer information only to fulfil orders; don’t contact customers for marketing without their consent.'])],
      ['Couriers', ul(['Drive or ride safely and legally; never use a phone while driving except hands-free.', 'Keep food sealed and handle it hygienically; never open or tamper with an order.', 'Deliver to the right person or place and follow the customer’s drop-off choice (photo at the door or PIN).', 'Never share your account or let someone else deliver for you.', 'Don’t ask customers for cash, extra tips or to cancel outside the app.'])],
      ['Platform misuse', ul(['No fraud, chargeback abuse or stolen payment methods.', 'No abuse of promo codes, referrals or Send Koro credit (including multiple accounts, fake referrals or reselling credit).', 'No scraping, bots, reverse engineering, or attempts to access accounts or systems without permission.', 'No selling or delivering alcohol, tobacco, cannabis, weapons or illegal items through Send Koro.', 'No spam or unsolicited messages to other users.'])],

  V.welcome = () => `<div class="dxw3 dxw5">
    <div class="dxw5-hero">
      <div class="dxw5-brand"><span class="logo dxw-logo">${LOGO('', 38)}${WORD}</span><span class="dxw3-tag">Driver</span></div>
      <div class="dxw5-art"><img src="${W_ART}" alt="A Send Koro courier riding an e-bike past Brooklyn brownstones and the Brooklyn Bridge"></div>
      <div class="dxw5-copy">${S.area ? `<span class="dxw5-kicker"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z" fill="currentColor"/></svg>Deliver in ${S.area}</span>` : ''}

    <div class="dxw3-body">
      <div class="dxw3-list">${[['fee', 'No fees, no subscription', 'Nothing is ever taken from your pay or tips.'], ['min', 'At least $22.13 per trip hour', 'NYC’s minimum, topped up every week.'], ['bank', 'Paid every Monday', 'Straight to your bank through Stripe.']].map(([k, t, d]) => `<div class="dxw3-row"><span class="dxw-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${W_IC[k]}</svg></span><span class="col" style="gap:2px"><b>${t}</b><span>${d}</span></span></div>`).join('')}</div>

    <div class="dxw3-cta"><button class="btn dxw-cta" data-a="go" data-to="signin">Get started</button>
      <button class="btn ln dxw-alt" data-a="go" data-to="signin">I already drive · <u>Sign in</u></button></div></div>`;

  V.signin = () => `${head('Sign in')}${body(`<h1 style="font-size:26px;color:var(--ink)">${S.codeSent ? 'Enter your code' : 'Your mobile number'}</h1>
    <p class="mut" style="margin:0">${S.codeSent ? `We texted a code to ${esc(S.phone)}. <b>Prototype: any 6 digits work.</b>` : 'We’ll text you a 6-digit code. No passwords.'}</p>
    ${S.codeSent ? `<label class="f">6-digit code<input class="in" id="d-code" data-m="code" inputmode="numeric" maxlength="6" value="${esc(S.code)}" style="font-size:22px;letter-spacing:.4em;text-align:center;font-weight:800"></label><button class="btn" data-a="verify">Continue</button><button class="btn gh" data-a="changePhone">Use a different number</button>` : `<label class="f">Mobile number<input class="in" id="d-phone" data-m="phone" inputmode="tel" placeholder="(347) 555-0123" value="${esc(S.phone)}"></label><label class="row sm-t"><input type="checkbox" data-m="newDriver" ${S.newDriver ? 'checked' : ''}>I’m new and want to apply</label><button class="btn" data-a="sendCode">Text me a code</button><p class="mut sm-t" style="margin:0">By continuing you agree to the <button class="lg-link" data-a="legalOpen" data-id="driverTerms">Courier Agreement</button> and <button class="lg-link" data-a="legalOpen" data-id="privacy">Privacy Policy</button>, and to get text codes and trip messages (<button class="lg-link" data-a="legalOpen" data-id="sms">Text Message Terms</button>).</p>`}`)}`;

  const VEH = { bike: 'Bike', ebike: 'E-bike', scooter: 'Moped', car: 'Car' };
  const ageOf = (d) => { const b = new Date(d); if (isNaN(b)) return 0; const n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a; };
  const chk = (path, on, label, rr = 1) => `<label class="row" style="align-items:flex-start;gap:10px"><input type="checkbox" data-m="${path}" ${rr ? 'data-rr="1"' : ''} ${on ? 'checked' : ''} style="width:22px;height:22px;margin-top:1px;flex:none"><span>${label}</span></label>`;
  V.apply = () => {
    const a = S.app; const motor = a.vehicle === 'car' || a.vehicle === 'scooter';
    const steps = ['You', 'Vehicle', 'Documents', 'Agreements', 'Payouts'];
    const bar = `<div class="row" style="gap:4px">${steps.map((t, i) => `<div class="col grow" style="gap:3px"><div style="height:5px;border-radius:99px;background:${i < a.step ? '#0B3B6E' : 'var(--line)'}"></div><span style="font-size:11px;font-weight:700;color:${i + 1 === a.step ? 'var(--ink)' : 'var(--mut)'}">${t}</span></div>`).join('')}</div>`;
    const first = esc(a.name.split(' ')[0] || 'there');
    if (a.status === 'review') return `${head('Application')}${body(`<div class="card pad col" style="gap:10px"><span class="pill p-o" style="align-self:flex-start">Step 1 of 2 · first checks</span><b style="font-size:20px">Thanks, ${first}. We’re checking your identity${motor ? ' and driving record' : ''}.</b><span class="mut sm-t">Usually 1–2 days. Criminal history is not checked yet: under NYC’s Fair Chance Act we only check it after we make you a conditional offer.</span><button class="btn sm" data-a="appStatus" data-v="conditional">First checks pass (demo)</button></div>`)}`;
    if (a.status === 'conditional') return `${head('Conditional offer')}${body(`<div class="card pad col" style="gap:10px;background:var(--gt);border-color:#C9D6E4"><span class="pill p-g" style="align-self:flex-start">Conditional offer</span><b style="font-size:20px">Good news, ${first}! You passed the first checks.</b><span class="sm-t">This is a conditional offer to deliver with Send Koro. The last step is a criminal history check by our screening partner. Only convictions that relate directly to delivery work, or that put people at real risk, can affect this offer, as NY Correction Law Article 23-A requires.</span></div>
      <div class="card pad col" style="gap:10px"><b>Criminal history check authorization</b>${chk('app.crim', a.crim, 'I authorize Send Koro and its screening partner to run a criminal history check. I’ve read the <b>Summary of Your Rights Under the FCRA</b> and <b>NY Correction Law Article 23-A</b>.')}<details class="sm-t"><summary><b>Read the summaries</b></summary><p class="mut">You can ask for a copy of your report, dispute anything wrong in it, and you’ll get a written notice and time to respond before any decision. Article 23-A means a past conviction can’t be the reason we say no unless it’s directly related to this work or a real safety risk.</p></details><button class="btn" data-a="startCrim">Start the check</button></div>`)}`;
    if (a.status === 'crim') return `${head('Final check')}${body(`<div class="card pad col" style="gap:10px"><span class="pill p-o" style="align-self:flex-start">Step 2 of 2 · criminal history</span><b style="font-size:20px">Your final check is running.</b><span class="mut sm-t">Usually 1–3 days. We’ll text and email you.</span><button class="btn sm" data-a="appStatus" data-v="ready">Check comes back clear (demo)</button><button class="btn ln sm" data-a="appStatus" data-v="adverse">Something comes up (demo)</button></div>`)}`;
    if (a.status === 'adverse') return `${head('Fair Chance notice')}${body(`<div class="card pad col" style="gap:8px;border-color:#C9D6E4;background:var(--ot)"><b style="font-size:19px">We haven’t made a decision yet</b><span class="sm-t">Your check showed something we have to review. Before we decide, NYC’s Fair Chance process gives you:</span><ul class="sm-t" style="margin:0;padding-left:18px"><li>A copy of the report</li><li>Our written Article 23-A assessment explaining our concern</li><li><b>At least 5 business days</b> to reply. Your offer stays open while we review.</li></ul><div class="row wrap"><button class="btn ln sm" data-a="toastMsg" data-msg="Would open your report (prototype)">View report</button><button class="btn ln sm" data-a="toastMsg" data-msg="Would open our Article 23-A assessment (prototype)">View our assessment</button></div></div>
      <div class="card pad col"><label class="f">Tell us anything we should know (errors, rehabilitation, references)<textarea class="in" id="fc-resp" data-m="app.fcResp">${esc(a.fcResp)}</textarea></label><label class="btn ln sm" style="cursor:pointer;align-self:flex-start">Attach documents<input type="file" data-file="fcFile" style="position:absolute;width:1px;height:1px;opacity:0"></label>${a.fcFile ? `<span class="pill p-g" style="align-self:flex-start">${esc(a.fcFile)}</span>` : ''}<button class="btn" data-a="fcSend">Send my response</button></div>`)}`;

    if (a.step === 4) inner = `<div class="card pad col" style="gap:8px"><b>Independent contractor agreement</b><span class="sm-t mut">You choose when and where to deliver, can decline any offer, and can deliver for other apps too. Every offer shows your pay before you accept, and Send Koro never charges you fees.</span>${chk('app.ica', a.ica, 'I agree to the Courier Agreement (independent contractor), the Community Guidelines and the Privacy Policy.')}<div class="row wrap" style="gap:12px"><button class="lg-link" data-a="legalOpen" data-id="driverTerms">Read the Courier Agreement</button><button class="lg-link" data-a="legalOpen" data-id="usage">Community Guidelines</button><button class="lg-link" data-a="legalOpen" data-id="privacy">Privacy Policy</button></div></div>

  V.battery = () => `${head('Battery safety')}${body(`<div class="card pad col" style="gap:8px"><b style="font-size:17px">Lithium-ion battery safety</b><ul class="sm-t" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px"><li>Use only UL-certified e-bikes, batteries and chargers.</li><li>Use the charger that came with your battery. Never modify it.</li><li>Don’t charge overnight or while you’re away, and keep it clear of exits.</li><li>Stop using a battery that’s hot, swollen, leaking or smells odd.</li><li>Recycle old batteries at a drop-off site, never in the trash.</li><li>If it catches fire, get out and call 911.</li></ul><span class="mut sm-t">From the FDNY and NYC DCWP safety guide (prototype summary).</span></div>`)}`;
  V.tax = () => { const ytd = 2480900; return `${head('Tax documents')}${body(`<div class="card pad col" style="gap:6px"><b>2026 · Form 1099-NEC</b><span class="sm-t">Ready by January 31, 2027. We’ll email you when it’s in your Stripe account.</span><div class="rw"><span class="mut">Paid to you so far in 2026</span><b>${money(ytd)}</b></div><span class="mut sm-t">Includes locked pay, tips and NYC top-ups. Send Koro files a 1099-NEC when you’re paid $2,000 or more in the year.</span></div><div class="card pad col" style="gap:6px"><b>Tax details</b><span class="sm-t">On file with Stripe ✓</span><button class="btn ln sm" data-a="toastMsg" data-msg="Would open Stripe to update your tax details (prototype)" style="align-self:flex-start">Update on Stripe</button></div><span class="mut sm-t">You’re an independent contractor, so no tax is held back from your pay. Talk to a tax advisor about quarterly estimated taxes.</span>`)}`; };

  V.home = () => {
    const t = weekTotals(); const today = S.trips.filter((x) => x.when.startsWith('Today'));

  V.earnings = () => {
