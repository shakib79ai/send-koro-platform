<title>Send Koro Customer PWA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800;1,900&family=Merriweather:wght@700;900&family=Nunito+Sans:opsz,wght@6..12,600;6..12,700;6..12,800;6..12,900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--g:#0D3B2E;--g2:#1F5A47;--gt:#E4F0E8;--gx:#0D5C3F;--o:#F2600C;--o2:#C2410C;--ot:#FFF1E6;--bg:#FBF6EE;--card:#FFFFFF;--line:#ECE3D6;--line2:#D9CFC0;--ink:#17201B;--mut:#5E6560;--red:#B42318;--redt:#FFF1EE;--warn:#FFF4E5;--warnx:#8A3B00;--stage:#E9E3D8;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gx)}
h1,h2,h3{margin:0;text-wrap:balance}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border:0;border-radius:12px;background:var(--o);color:#fff;font-weight:700;font-size:19px;text-decoration:none;white-space:nowrap}
.btn:disabled{background:#E2D8CA;color:var(--mut);cursor:not-allowed}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;background:var(--o2)}
.btn.dk{background:var(--g);font-size:16px}
.btn.ln{background:#fff;color:var(--g);border:1.5px solid var(--g);font-size:15px}
.btn.ln.sm{min-height:40px}
.btn.gh{background:transparent;color:var(--gx);font-size:15px;min-height:44px;padding:0 8px}
.btn.block{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pad{padding:16px}
.mut{color:var(--mut)}
.sm-t{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.in{height:48px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;width:100%;font-size:15px}
textarea.in{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.in:focus,.btn:focus-visible,.chip:focus-visible,.opt:focus-within,button:focus-visible,a:focus-visible{outline:3px solid #F9B98C;outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;border-radius:12px;border:1.5px solid #E2D8CA;background:#fff;font-weight:600;cursor:pointer;text-align:left}
.opt.on{border-color:var(--o);background:#FFF4EC}
.opt input{width:18px;height:18px;accent-color:var(--o);margin:0;flex:none}
.rw{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.rw.tot{font-size:19px;font-weight:800;padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.rw.save{color:var(--gx);font-weight:700}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.p-g{background:var(--gt);color:var(--gx)}.p-o{background:var(--ot);color:var(--warnx)}.p-n{background:#F3EDE3;color:var(--mut)}.p-r{background:var(--redt);color:var(--red)}
.note{padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45}
.n-g{background:var(--gt);color:var(--g)}.n-w{background:var(--warn);color:#4A2200}.n-r{background:var(--redt);color:#7A1A0E}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;background:#fff}
.qty button{width:38px;height:38px;border:0;background:transparent;font-size:18px}
.qty b{min-width:22px;text-align:center}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:200;max-width:min(420px,90vw);box-shadow:0 10px 30px rgba(0,0,0,.25);text-align:center}
.overlay{position:fixed;inset:0;background:rgba(15,20,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.device .overlay{position:absolute}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px;display:flex;flex-direction:column;gap:14px}
.web .overlay{align-items:center;padding:16px}
.web .sheet{border-radius:20px;max-height:88vh}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:#CFC6B8;margin:0;cursor:pointer;transition:background .15s}
.switch input:checked{background:#0D7A50}
.switch input::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:99px;background:#fff;transition:left .15s}
.switch input:checked::after{left:21px}
.demo{background:var(--g);color:#CFE3D7;font-size:12px;text-align:center;padding:6px 12px}
.demo b{color:#fff}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em}
.empty{padding:28px 16px;text-align:center;color:var(--mut)}
img{max-width:100%}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 16px}
.device{width:390px;max-width:100%;height:844px;max-height:calc(100vh - 80px);min-height:620px;border-radius:44px;border:10px solid #17201B;background:var(--bg);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.stage-note{font-size:13px;color:var(--mut);text-align:center;max-width:390px}
@media (max-width:440px){.stage{padding:0;gap:0}.device{border:0;border-radius:0;height:100vh;max-height:none;width:100%;min-height:0}.stage-note{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:760px){.rw-shell{flex-direction:column}.rw-shell>aside{width:100%!important;height:auto!important;position:static!important;flex-direction:row!important;flex-wrap:wrap;align-items:center;padding:10px max(12px,env(safe-area-inset-left,0px))!important}.rw-shell>aside>span:nth-child(2),.rw-shell>aside>.grow,.rw-shell>aside>div{display:none}.rw-shell>aside>.logo{padding:0 8px 0 0!important;flex-basis:100%}.rw-shell>aside>button{height:38px!important;padding:0 10px!important;box-shadow:none!important}.rw-shell main{padding-left:max(16px,env(safe-area-inset-left,0px))!important}}
.pages{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#fff;border-bottom:1px solid var(--line)}
.stage>.pages{max-width:880px;width:100%;border:1px solid var(--line);border-radius:16px}
.pages-l{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--o2);margin-right:4px}
.pages button{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:700;font-size:13px;color:var(--ink)}
.pages button:hover{border-color:var(--g)}
.pages button.on{background:var(--g);border-color:var(--g);color:#fff}
@media (max-width:440px){.stage>.pages{border-radius:0;border-width:0 0 1px;flex-wrap:nowrap;overflow-x:auto}}
.pages{position:relative;z-index:150}
.fwrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fcol{gap:9px}.fcol>b{color:#fff;font-size:15px;margin-bottom:2px}
.flink{border:0;background:none;color:#E4F0E8;padding:2px 0;text-align:left;font-size:14px;cursor:pointer}
.flink:hover{color:#fff;text-decoration:underline}
.info p{margin:0;line-height:1.55}
@media (max-width:760px){.rw-shell>aside>span:not(.logo){display:none}.rw-shell>aside{overflow:visible!important}}

.pages-l{white-space:nowrap}

/* ---- v3.1 home polish ---- */
.lx-top{background:radial-gradient(120% 90% at 100% 0%,#1F6B50 0%,var(--g) 55%,#082A20 100%);color:#fff;padding:16px 16px 18px;gap:14px;border-radius:0 0 26px 26px}
.lx-av{width:38px;height:38px;border-radius:99px;background:#FF7A2E;color:var(--g);display:flex;align-items:center;justify-content:center;font-weight:800}
.lx-addr{border:0;background:rgba(255,255,255,.1);color:#fff;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;text-align:left;font-size:14px;width:100%}
.lx-addr b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lx-hello{font-size:28px;line-height:1.08;letter-spacing:-.03em;margin:4px 0 0;text-wrap:balance}
.lx-search{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:999px;background:#fff;color:var(--mut);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.lx-search input{border:0;outline:0;flex:1;min-width:0;background:transparent;font-size:16px;color:var(--ink)}
.lx-seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:rgba(255,255,255,.12);max-width:340px;width:100%}
.lx-seg button{height:40px;border:0;border-radius:999px;background:transparent;color:#E4F0E8;font-weight:800;font-size:15px}
.lx-seg button.on{background:#FF7A2E;color:#1B1006;box-shadow:0 4px 14px rgba(242,96,12,.45)}
.lx-promos{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
.lx-promos::-webkit-scrollbar{display:none}
.lx-promo{position:relative;flex:0 0 min(300px,82%);height:168px;border:0;border-radius:20px;overflow:hidden;scroll-snap-align:start;padding:0;text-align:left;color:#fff;background:var(--tone)}
.lx-promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.lx-promo:hover img{transform:scale(1.05)}
.lx-promo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--tone) 18%,color-mix(in srgb,var(--tone) 55%,transparent) 55%,transparent)}
.lx-promo-t{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;padding:16px;max-width:72%;height:100%}
.lx-promo-t b{font-size:19px;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.lx-promo-t>span:not(.lx-kick):not(.lx-cta){font-size:13px;color:rgba(255,255,255,.82)}
.lx-cta{margin-top:auto;font-weight:800;font-size:14px;color:#FFB27F}
.lx-kick{display:inline-flex;align-self:flex-start;align-items:center;height:24px;padding:0 10px;border-radius:99px;background:#FF7A2E;color:#1B1006;font-size:12px;font-weight:800;letter-spacing:.02em}
.lx-cuis{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.lx-cuis::-webkit-scrollbar{display:none}
.lx-cu{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;font-weight:700;font-size:13px;color:var(--ink);padding:0;width:74px}
.lx-cu img{width:70px;height:70px;border-radius:99px;object-fit:cover;box-shadow:0 0 0 3px #fff,0 6px 16px rgba(28,22,16,.18);transition:transform .2s}
.lx-cu:hover img{transform:translateY(-3px)}
.lx-cu.on img{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--o)}
.lx-cu.on{color:var(--o2)}
.lx-h{font-size:22px;letter-spacing:-.02em;margin:0}
.lx-card{display:flex;flex-direction:column;border:0;padding:0;text-align:left;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 12px 28px -14px rgba(28,22,16,.28);transition:transform .2s,box-shadow .2s}
.lx-card:hover{transform:translateY(-3px);box-shadow:0 1px 0 var(--line),0 20px 36px -16px rgba(28,22,16,.38)}
.lx-img{position:relative;display:block;height:170px;overflow:hidden}
.lx-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.lx-card:hover .lx-img img{transform:scale(1.05)}
.lx-img::after{content:"";position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.35))}
.lx-deal{position:absolute;top:12px;left:12px;z-index:1;height:28px;padding:0 11px;display:flex;align-items:center;border-radius:99px;background:#FF7A2E;color:#1B1006;font-weight:800;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.lx-eta{position:absolute;bottom:10px;right:12px;z-index:1;height:28px;padding:0 10px;display:flex;align-items:center;border-radius:99px;background:rgba(255,255,255,.95);color:var(--g);font-weight:800;font-size:13px}
.lx-rate{flex:none;height:26px;padding:0 9px;border-radius:99px;background:var(--gt);color:var(--g);font-weight:800;font-size:13px;display:flex;align-items:center}
.lx-promise{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px;border-radius:18px;background:var(--g);color:#CFE3D7;font-size:12px;text-align:center}
.lx-promise span{display:flex;flex-direction:column;gap:2px}.lx-promise b{color:#FF9A5C;font-size:20px}
.lx-hero{position:relative;display:flex;flex-wrap:wrap;gap:32px;align-items:center;padding:44px clamp(20px,4vw,52px);border-radius:32px;overflow:hidden;color:#fff;background:radial-gradient(90% 120% at 100% 0%,#1F6B50 0%,var(--g) 50%,#072219 100%)}
.lx-hero::before{content:"";position:absolute;width:520px;height:520px;right:-120px;bottom:-260px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,46,.35),transparent 65%)}
.lx-hero-h{font-size:clamp(40px,5.2vw,66px);line-height:1;letter-spacing:-.04em;margin:0;color:#fff}
.lx-hero-h span{color:#FF8A47}
.lx-hero .lx-addr{background:rgba(255,255,255,.08);width:auto}
.lx-collage{position:relative;flex:1 1 380px;min-height:360px;max-width:560px}
.lx-collage img{position:absolute;object-fit:cover;border-radius:24px;box-shadow:0 24px 50px rgba(0,0,0,.35);border:4px solid rgba(255,255,255,.9)}
.lx-collage .c1{width:68%;height:72%;left:0;top:6%;transform:rotate(-3deg)}
.lx-collage .c2{width:46%;height:48%;right:0;top:0;transform:rotate(4deg)}
.lx-collage .c3{width:44%;height:44%;right:6%;bottom:0;transform:rotate(-2deg)}
.lx-float{position:absolute;z-index:2;display:flex;gap:6px;align-items:center;padding:9px 14px;border-radius:99px;background:#fff;color:var(--ink);font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);white-space:nowrap}
.lx-float b{color:var(--o2);font-size:15px}
.lx-float.f1{left:4%;bottom:12%}.lx-float.f2{left:42%;top:46%}.lx-float.f3{right:2%;bottom:-2%}
@media (max-width:640px){.lx-collage{display:none}.lx-hero{padding:28px 20px;border-radius:24px}}
@media (prefers-reduced-motion:reduce){.lx-card,.lx-card img,.lx-promo img,.lx-cu img{transition:none}}

/* ---- v3.1 driver polish ---- */
.dx-hero{position:relative;height:330px;overflow:hidden;background:#0F2A22}
.dx-map{position:absolute;inset:0;width:100%;height:100%}
.dx-topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:2}
.dx-av{width:42px;height:42px;border-radius:99px;border:2px solid rgba(255,255,255,.7);background:#FF7A2E;color:#1B1006;font-weight:800;font-size:17px}
.dx-earn{margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:6px 18px;border:0;border-radius:99px;background:#fff;color:var(--g);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.dx-earn span{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}.dx-earn b{font-size:20px;letter-spacing:-.02em}
.dx-status{height:30px;padding:0 12px;border-radius:99px;display:flex;align-items:center;font-size:13px;font-weight:800;background:rgba(255,255,255,.14);color:#fff}
.dx-status.on{background:#7CF0B4;color:#073424}
.dx-go{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,0);z-index:3;width:116px;height:116px;border-radius:99px;border:6px solid var(--bg);background:radial-gradient(circle at 35% 30%,#3FCB8A,#0D7A50 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(13,122,80,.55)}
.dx-go b{font-size:30px;letter-spacing:.04em;line-height:1}.dx-go span{font-size:11px;font-weight:700;opacity:.85}
.dx-go.on{background:radial-gradient(circle at 35% 30%,#5A4A42,#2A211D 70%);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.dx-go:not(.on)::after{content:"";position:absolute;inset:-6px;border-radius:99px;border:3px solid #3FCB8A;animation:dxpulse 2s infinite}
@keyframes dxpulse{from{transform:scale(1);opacity:.8}to{transform:scale(1.35);opacity:0}}
.dx-sheet{position:relative;margin-top:-18px;padding:72px 14px 22px;gap:14px;background:var(--bg);border-radius:26px 26px 0 0}
.dx-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dx-stats div{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:16px;background:var(--card);box-shadow:0 1px 0 var(--line),0 8px 20px -14px rgba(28,22,16,.35)}
.dx-stats span{font-size:11px;color:var(--mut);font-weight:700}.dx-stats b{font-size:20px;color:var(--g);letter-spacing:-.02em}
.dx-week{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;padding:16px;border:0;border-radius:20px;text-align:left;color:#fff;background:radial-gradient(120% 120% at 100% 0%,#1F6B50,var(--g) 55%,#072219)}
.dx-chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;width:100%;height:110px;margin-top:10px;align-items:end}
.dx-bar{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.dx-bar i{display:block;width:100%;max-width:28px;border-radius:8px 8px 4px 4px;background:var(--gt)}
.dx-bar.dk i{background:rgba(255,255,255,.22)}.dx-bar.now i{background:linear-gradient(#FFB27F,#F2600C)}
.dx-bar em{font-style:normal;font-size:10px;font-weight:700;color:var(--mut)}.dx-bar.dk em{color:#CFE3D7}
.dx-bar b{font-size:11px;color:var(--mut)}.dx-bar.dk b{color:#A9C9B8}
.dx-perks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dx-perks span{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;padding:10px 4px;border-radius:14px;background:var(--ot);font-size:11px;color:var(--warnx);font-weight:600}
.dx-perks b{font-size:14px;color:var(--o2)}
.dx-offer{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:20px;color:#fff;background:radial-gradient(120% 120% at 100% 0%,#1F6B50,var(--g) 55%,#072219)}
.dx-offer>b{font-size:46px;line-height:1.02;letter-spacing:-.03em}
.dx-chip{height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:99px;background:rgba(255,255,255,.12);font-weight:800;font-size:13px}
.dx-welcome{background:radial-gradient(110% 70% at 80% 10%,#1F6B50,var(--g) 50%,#061D16)}
@media (prefers-reduced-motion:reduce){.dx-go::after{animation:none}}
@media (min-width:900px){.web .lx-cu{width:104px}.web .lx-cu img{width:96px;height:96px}.web .lx-cu{font-size:14px}}

/* ---- v3.2 customer polish (scoped to .cx) ---- */
.cx .card{border-radius:18px;border-color:#EFE6D8;box-shadow:0 1px 0 rgba(28,22,16,.04),0 10px 26px -18px rgba(28,22,16,.35)}
.cx .btn:not(.ln):not(.gh):not(.dk):not(:disabled){background:linear-gradient(180deg,#FF7A2E,#EE5A08);box-shadow:0 8px 20px -8px rgba(242,96,12,.6),inset 0 1px 0 rgba(255,255,255,.25);border-radius:14px;transition:transform .15s,box-shadow .15s}
.cx .btn:not(.ln):not(.gh):not(.dk):not(:disabled):hover{transform:translateY(-1px);box-shadow:0 12px 24px -8px rgba(242,96,12,.7),inset 0 1px 0 rgba(255,255,255,.25)}
.cx .btn.ln{border-radius:14px;border-color:#CFE0D5}
.cx .btn.dk{border-radius:14px;background:linear-gradient(180deg,#1F5A47,var(--g))}

    const pct = Math.max(0, idx) / (steps.length - 1);

  // ---------- overlays ----------
  function itemSheet() {
    const sh = S.sheet; const r = rest(sh.rid); const it = findItem(r, sh.itemId);
    const unit = lineUnit(it, sh.sel);
    const groups = (it.opts || []).map((g) => `<fieldset style="margin:0;padding:0;border:0" class="col"><legend class="row between" style="width:100%;padding:0 0 6px"><b>${esc(g.name)}</b><span class="mut sm-t">${g.one ? 'Choose 1' : `Up to ${g.max}`}</span></legend>${g.choices.map((c) => { const on = g.one ? sh.sel[g.id] === c.id : !!(sh.sel[g.id] && sh.sel[g.id][c.id]); return `<label class="opt ${on ? 'on' : ''}"><input type="${g.one ? 'radio' : 'checkbox'}" name="g-${g.id}" data-a="optPick" data-g="${g.id}" data-c="${c.id}" ${on ? 'checked' : ''}><span class="grow">${esc(c.name)}</span><span class="mut">${c.price ? '+' + money(c.price) : 'Included'}</span></label>`; }).join('')}</fieldset>`).join('');
    return `<div class="overlay" data-a="closeSheet" data-self="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(it.name)}">
      ${it.img ? `<img src="${IMG(it.img)}" alt="" style="width:100%;height:180px;object-fit:cover;border-radius:14px">` : ''}
      <div class="row between" style="align-items:flex-start"><div><h2 style="font-size:22px">${esc(it.name)}</h2><div class="mut">${esc(it.desc)}</div></div><b style="font-size:19px">${money(it.price)}</b></div>
      ${groups}
      ${it.allergens ? `<div class="note n-w"><b>Allergens:</b> ${esc(it.allergens)}</div>` : ''}
      <label class="f">Note for the kitchen<input class="in" id="it-note" data-m="sheet.note" placeholder="e.g. no onions" value="${esc(sh.note || '')}"></label>
      <div class="row"><span class="qty"><button data-a="sheetQty" data-d="-1" aria-label="Fewer">−</button><b>${sh.qty}</b><button data-a="sheetQty" data-d="1" aria-label="More">+</button></span><button class="btn grow" data-a="addToCart">${sh.editIndex != null ? 'Update item' : 'Add to cart'} · ${money(unit * sh.qty)}</button></div>
      <button class="btn gh" data-a="closeSheet">Cancel</button></div></div>`;
  }
  function modal() {
    const md = S.modal;
    if (md.type === 'locate') return `<div class="overlay"><div class="sheet loc-sheet" role="dialog" aria-modal="true" aria-label="Allow your location"><button class="loc-x" data-a="locType" data-close="1" aria-label="Close">×</button><h2 style="font-size:26px;margin:0">Allow your location</h2>${LOC_ART}<p class="mut" style="margin:0;text-align:center">Skip the typing and see restaurants near you.</p>${S.locating === 'modal' ? '<div class="row" style="justify-content:center;gap:10px;min-height:52px"><span class="gps-spin" aria-hidden="true"></span><b>Finding you…</b></div>' : '<button class="btn" data-a="locAllow" style="min-height:52px">Allow</button>'}<button class="btn gh" data-a="locType">Type in delivery address instead</button></div></div>`;
    if (md.type === 'replace') return `<div class="overlay"><div class="sheet" role="dialog" aria-modal="true"><h2 style="font-size:22px">Start a new cart?</h2><p class="mut" style="margin:0">Your cart has items from ${esc(rest(S.cart.rid).name)}. Each order comes from one restaurant.</p><button class="btn" data-a="replaceCart">Start new cart</button><button class="btn ln" data-a="closeModal" style="min-height:52px">Keep current cart</button></div></div>`;
    if (md.type === 'receipt') { const o = S.orders.find((x) => x.id === md.id); const r = rest(o.rid); return `<div class="overlay" data-a="closeModal" data-self="1"><div class="sheet" role="dialog" aria-modal="true"><div class="row between"><h2 style="font-size:22px">Receipt ${o.id}</h2><button class="btn gh" data-a="closeModal" aria-label="Close">✕</button></div><div class="mut">${esc(r.name)} · ${esc(o.when)}</div><div class="card pad col" style="gap:2px">${o.lines.map((l) => `<div class="rw"><span>${l.qty}× ${esc(l.name)}${l.desc ? ` <span class="mut sm-t">(${esc(l.desc)})</span>` : ''}</span><span>${money(l.unit * l.qty)}</span></div>`).join('')}</div><div class="card pad col" style="gap:2px">${receiptRows(o.q, r, o.fulfil)}</div>${o.status === 'declined' ? '<div class="note n-g">Declined by the restaurant. The hold was released and you were not charged.</div>' : '<div class="mut sm-t">Paid with Visa •••• 4242. No Send Koro service or card fees.</div>'}<button class="btn" data-a="closeModal">Done</button></div></div>`; }
    if (md.type === 'info') { const [t, html] = INFO[md.k]; return `<div class="overlay" data-a="closeModal" data-self="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(t)}"><div class="row between"><h2 style="font-size:22px">${esc(t)}</h2><button class="btn gh" data-a="closeModal" aria-label="Close">✕</button></div><div class="col info">${html}</div><button class="btn" data-a="closeModal">Done</button></div></div>`; }
    if (md.type === 'card') { const c = md; return `<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="${c.id ? 'Edit card' : 'Add a card'}"><h2 style="font-size:22px">${c.id ? `Edit ${esc(c.brand)} •••• ${c.last4}` : 'Add a card'}</h2>
      ${c.id ? '<span class="mut sm-t">To change the card number, add a new card and remove this one.</span>' : `<label class="f">Card number<input class="in" id="cd-num" inputmode="numeric" autocomplete="cc-number" data-m="modal.num" value="${esc(c.num || '')}" placeholder="4242 4242 4242 4242"></label>`}
      <div style="display:grid;grid-template-columns:1fr 1fr${c.id ? '' : ' 1fr'};gap:10px"><label class="f">Expiry<input class="in" id="cd-exp" inputmode="numeric" autocomplete="cc-exp" data-m="modal.exp" value="${esc(c.exp || '')}" placeholder="MM/YY"></label>${c.id ? '' : `<label class="f">CVC<input class="in" id="cd-cvc" inputmode="numeric" autocomplete="cc-csc" data-m="modal.cvc" value="${esc(c.cvc || '')}" placeholder="123"></label>`}<label class="f">ZIP<input class="in" id="cd-zip" inputmode="numeric" autocomplete="postal-code" data-m="modal.zip" value="${esc(c.zip || '')}" placeholder="11205"></label></div>
      ${c.id ? '' : `<label class="row"><input type="checkbox" id="cd-def" data-m="modal.def" ${c.def ? 'checked' : ''}>Make this my default card</label>`}
      <button class="btn" data-a="saveCard">${c.id ? 'Save changes' : 'Save card'}</button><button class="btn gh" data-a="closeModal">Cancel</button><span class="mut sm-t" style="text-align:center">Secured by Stripe. Prototype: no real card is saved.</span></div></div>`; }
    if (md.type === 'delCard') { const c = cardById(md.id); return `<div class="overlay"><div class="sheet" role="dialog" aria-modal="true"><h2 style="font-size:22px">Remove ${esc(c.brand)} •••• ${c.last4}?</h2><p class="mut" style="margin:0">You can add it again any time.</p><button class="btn" data-a="confirmDelCard" data-id="${c.id}" style="background:#C81E24">Remove card</button><button class="btn gh" data-a="closeModal">Keep it</button></div></div>`; }
    if (md.type === 'name') return `<div class="overlay"><div class="sheet" role="dialog" aria-modal="true"><h2 style="font-size:22px">Edit your name</h2><label class="f">Name<input class="in" id="md-name" data-m="modal.value" value="${esc(md.value)}"></label><button class="btn" data-a="saveName">Save</button><button class="btn gh" data-a="closeModal">Cancel</button></div></div>`;
    return '';
  }

    sendEmailCode: () => { const e = S.profile.email.trim(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)) return toast('Enter a valid email address.'); S.profile.emailSent = true; S.profile.emailCode = ''; toast(`Code sent to ${e}. Prototype: any 6 digits work.`); render(); },
    verifyEmail: () => { if (!/^\d{6}$/.test(S.profile.emailCode)) return toast('Enter the 6-digit code from the email.'); S.user.email = S.profile.email.trim(); S.user.emailVerified = true; S.profile.emailSent = false; toast('Email verified. Receipts will go there.'); render(); },
    sendPhoneCode: () => { const d = S.profile.phone.replace(/\D/g, ''); if (!S.profile.phoneSent && !S.profile.phone) { setTimeout(() => { const el = document.getElementById('pf-phone'); if (el) el.focus(); }, 30); return toast('Type your new mobile number.'); } if (!(d.length === 10 || (d.length === 11 && d[0] === '1'))) return toast('Enter a 10-digit US mobile number.'); S.profile.phoneSent = true; S.profile.phoneCode = ''; toast('Code texted. Prototype: any 6 digits work.'); render(); },
    verifyPhone: () => { if (!/^\d{6}$/.test(S.profile.phoneCode)) return toast('Enter the 6-digit code from the text.'); const d = S.profile.phone.replace(/\D/g, '').slice(-10); S.user.phone = `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`; S.profile.phone = ''; S.profile.phoneSent = false; toast('Mobile number updated. Use it to sign in from now on.'); render(); },
    toggleCredit: () => { S.wallet.useCredit = !S.wallet.useCredit; render(); },
    applyPromo: () => {
      const code = S.promoQ.trim().toUpperCase(); const CODES = { WELCOME10: 1000, BROOKLYN5: 500 };
      if (!code) return toast('Enter a promo code.');
      if (!CODES[code]) return toast('That code isn’t valid or has expired.');
      if (S.wallet.codes.includes(code)) return toast('You’ve already used that code.');
      S.wallet.codes.push(code); S.wallet.balance += CODES[code]; S.wallet.history.unshift({ id: 'w' + Date.now(), label: `Promo code ${code}`, cents: CODES[code], when: 'Today', note: 'Expires ' + in30() }); S.promoQ = ''; toast(`${money(CODES[code])} added to your wallet.`); render();
    },
    addCard: () => { S.modal = { type: 'card', num: '', exp: '', cvc: '', zip: '', def: !S.cards.length }; render(); },
    editCard: (d) => { const c = cardById(d.id); S.modal = { type: 'card', ...c }; render(); },
    saveCard: () => {
      const m = S.modal; const exp = (m.exp || '').replace(/\s/g, ''); const zip = (m.zip || '').trim();
      if (!/^(0[1-9]|1[0-2])\/?\d{2}$/.test(exp)) return toast('Enter the expiry as MM/YY.');
      if (!/^\d{5}$/.test(zip)) return toast('Enter a 5-digit ZIP code.');
      const e2 = exp.includes('/') ? exp : exp.slice(0, 2) + '/' + exp.slice(2);
      if (m.id) { Object.assign(cardById(m.id), { exp: e2, zip }); S.modal = null; toast('Card updated.'); return render(); }
      const num = (m.num || '').replace(/\D/g, ''); if (num.length < 15 || num.length > 16) return toast('Enter the full card number.'); if (!/^\d{3,4}$/.test(m.cvc || '')) return toast('Enter the 3 or 4-digit CVC.');
      const brand = num[0] === '4' ? 'Visa' : /^5[1-5]|^2[2-7]/.test(num) ? 'Mastercard' : /^3[47]/.test(num) ? 'Amex' : /^6/.test(num) ? 'Discover' : 'Card';
      const c = { id: 'c' + Date.now(), brand, last4: num.slice(-4), exp: e2, zip }; S.cards.push(c); if (m.def || !S.defaultCard) S.defaultCard = c.id; S.pay = c.id; S.modal = null; toast(`${brand} •••• ${c.last4} saved.`); render();
    },
    defCard: (d) => { S.defaultCard = d.id; toast('Default card changed.'); render(); },
    delCard: (d) => { S.modal = { type: 'delCard', id: d.id }; render(); },
    confirmDelCard: (d) => { S.cards = S.cards.filter((c) => c.id !== d.id); if (S.defaultCard === d.id) S.defaultCard = S.cards[0] ? S.cards[0].id : null; if (S.pay === d.id) S.pay = S.defaultCard || 'apple'; S.modal = null; toast('Card removed.'); render(); },
    editName: () => { S.modal = { type: 'name', value: S.user.name }; render(); },
    saveName: () => { if (S.modal.value.trim().length < 2) return toast('Enter your name.'); S.user.name = S.modal.value.trim(); S.modal = null; toast('Name updated.'); render(); },
    signOut: () => { S.signedIn = false; S.codeSent = false; S.code = ''; toast('Signed out.'); tabTo('home'); },
  };
  function commitAdd() {
    const sh = S.sheet; const it = findItem(rest(sh.rid), sh.itemId);
    const sel = JSON.parse(JSON.stringify(sh.sel));
    const line = { itemId: it.id, name: it.name, img: it.img, sel, note: sh.note || '', desc: [lineDesc(it, sel), sh.note].filter(Boolean).join(' · '), unit: lineUnit(it, sel), qty: sh.qty };
    if (sh.editIndex != null) { S.cart.lines.splice(sh.editIndex, 1, line); S.cart.rid = sh.rid; S.sheet = null; toast('Item updated.'); render(); return; }
    const same = S.cart.lines.find((l) => l.itemId === line.itemId && l.desc === line.desc);
    if (same) same.qty += line.qty; else S.cart.lines.push(line);
    S.cart.rid = sh.rid; S.sheet = null;
    toast(`Added ${sh.qty}× ${it.name}.`);
    render();
  }
  // Sign-up codes: a friend's referral code (NAME5, e.g. NADIA5) or a promo code. Your own phone is verified at this point.
  function signupCodeResult(raw) {
    const c = String(raw || '').trim().toUpperCase(); if (!c) return null;
    const PROMO = { WELCOME10: 1000, BROOKLYN5: 500 };
    if (PROMO[c]) return { ok: true, cents: PROMO[c], label: `Promo code ${c}`, msg: `${money(PROMO[c])} promo credit will be added to your wallet.` };
    if (/^[A-Z]{2,12}5$/.test(c)) { const who = c.slice(0, -1); const name = who[0] + who.slice(1).toLowerCase(); return { ok: true, cents: 500, label: `Welcome gift from ${name}`, friend: name, msg: `${name} sent you $5. It goes into your wallet when you create your account.` }; }
    return { ok: false, msg: 'We don’t recognize that code. Check it, or leave it empty; it’s optional.' };
  }
  function finishSignIn() {
    S.signedIn = true; if (S.phone) S.user.phone = S.phone;
    toast(`Signed in as ${S.user.name}.`);
    const after = S.after; S.after = null;
    if (after === 'checkout' && S.cart.lines.length) { S.stack = ['home', 'cart']; S.screen = 'checkout'; render(true); }
    else tabTo('home');
  }
  root.addEventListener('click', (e) => {
    const t = e.target.closest('[data-a]'); if (!t || !root.contains(t)) return;
    const fn = A[t.dataset.a]; if (!fn) return;
    if (t.tagName === 'INPUT' && (t.type === 'checkbox' || t.type === 'radio')) { /* allow default toggle */ } else e.preventDefault();
    fn(t.dataset, t, e);
  });

  // ---------- open any page directly ----------
  function demoCart() { if (!S.cart.lines.length) { S.cart = { rid: 'bbc', lines: [mkLine('bbc', 'gcb', { size: 'reg', ex: { avo: true } }), mkLine('bbc', 'slm')] }; S.fulfil = 'delivery'; S.tipPct = 18; } }
  function demoOrder(status) {
    S.signedIn = true; demoCart();
    const o = { id: 'SK' + ++orderSeq, rid: S.cart.rid, lines: S.cart.lines.map((l) => ({ ...l })), fulfil: 'delivery', q: curQuote(), status: 'waiting', when: 'Today, ' + nowTime(), timeline: [['waiting', nowTime()]], addr: addr().line };
    const steps = stepsFor(o); const idx = steps.findIndex((s) => s[0] === status);
    for (let i = 1; i <= idx; i++) o.timeline.push([steps[i][0], nowTime()]);
    o.status = status; S.orders.unshift(o); S.activeId = o.id; S.ordersTab = 'active'; S.cart = { rid: null, lines: [] };
    schedule(o); return o;
  }
  function setHash(k) { try { history.replaceState(null, '', '#' + k); } catch (e) { try { location.hash = k; } catch (e2) { /* ignore */ } } }
  function openPage(k) {
    S.sheet = null; S.modal = null; S.stack = [];
    if (k === 'item') { S.rid = 'bbc'; S.tab = 0; S.screen = 'restaurant'; S.stack = ['home']; setHash(k); A.openItem({ id: 'gcb' }); return; }
    if (k === 'restaurant') { S.rid = S.rid || 'bbc'; S.tab = 0; S.stack = ['home']; }
    if (k === 'cart') { demoCart(); S.stack = ['home']; }
    if (k === 'checkout') { demoCart(); S.signedIn = true; S.stack = ['home', 'cart']; }
    if (k === 'confirm') { demoOrder('waiting'); S.stack = ['home']; }
    if (k === 'track') { const live = S.orders.find((x) => x.id === S.activeId && !['delivered', 'collected', 'declined'].includes(x.status)); S.activeId = (live || demoOrder('picked')).id; S.stack = ['home']; }
    if (k === 'account') S.signedIn = true;
    if (k === 'profile' || k === 'wallet' || k === 'payments' || k === 'refer') { S.signedIn = true; S.profile = null; S.stack = ['home', 'account']; }
    if (k === 'signin') { S.codeSent = false; S.code = ''; S.stack = ['home']; }
    if (k === 'addresses' || k === 'help') S.stack = ['home'];
    if (k === 'addrForm') { S.addrForm = { street: '', apt: '', note: '', label: 'Other', def: false }; S.stack = ['home', 'account']; }
    S.screen = k; applyFulfil(k); setHash(k); render(true);
  }
  A.page = (d) => openPage(d.k);
  const h = (location.hash || '').slice(1);
  if (PAGES.some((p) => p[0] === h)) openPage(h); else render(true);
})();

</script>
